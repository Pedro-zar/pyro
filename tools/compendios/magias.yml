- nome: Tocha
  id: 0eJZYr18q5X7gfUY
  system:
    usaDt: false
    runas:
      - nome: Iluminar
        tipoDano: nenhum
        scalings:
          - nome: Raio (metros)
            base: 3
            porIntencao: 2
            faces: 0
      - nome: Manifestar
        scalings:
          - nome: Duração (minutos)
            base: 1
            porIntencao: 1
            faces: 0
    descricao: <p>Manifesta uma esfera de chamas na mão, iluminando em volta do usuário como uma tocha.</p><p>A iluminação terá iluminação normal igual ao valor da distância, e iluminação penumbra com o dobro dessa distância.</p>
  efeitos:
    - id: Rxp5K7VY2VSugcoH
      name: Tocha
      system:
        changes:
          - key: system.luz.normal
            value: '@raio'
            type: upgrade
            priority: 20
          - key: system.luz.penumbra
            value: '@raio *2'
            type: upgrade
            priority: 20
      duration:
        value: 6
        expiry: turnStart
        expired: true
      transfer: false
      flags:
        pyro:
          deUso: true
          prazoFormula:
            formula: '@duracao *10'
            unidade: turnos
          prazo:
            valor: 1
            unidade: turnos
          turnos: 1

