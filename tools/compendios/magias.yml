- nome: Lufada de Vento
  id: VLXCH9tcvoKDP6bb
  system:
    runas:
      - nome: Sopro
        elemento: vento
        tipoDano: impacto
        scalings:
          - nome: Dano
            base: 4
            porIntencao: 1
            faces: 4
          - nome: Empurrado (metros)
            base: 1
            porIntencao: 1
            faces: 0
      - nome: Rajada
        elemento: gesto
        scalings:
          - nome: Comprimento
            base: 6
            porIntencao: 4
            faces: 0
    descricao: '<p>Dispara uma rajada de vento em uma linha, causando dano e empurrando todos inimigos na linha.</p><p>Caso o usuário esteja no ar, ele é empurrado em uma distância igual aos alvos atingidos.</p><p></p><p>Intenção 0: Realiza um sopro constante breve e constante de vento não muito forte.</p>'
    resistencias:
      - pericia: Firmeza
        atributo: for
      - pericia: Reflexos
        atributo: agi
    area:
      ativa: true
      formas:
        - tipo: linha
          raio: '1'
          comprimento: '@runas.rajada.comprimento'
          largura: '1'
          angulo: '60'
          x: 0
          'y': 0
          rotacao: 0
          divisoes: '1'

