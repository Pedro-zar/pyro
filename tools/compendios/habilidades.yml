  pasta: Sicário
  img: systems/pyro/icons/tecnica.svg
  system:
    ehBase: true
    descricao: <p>Enquanto nessa postura, ao realizar ataques com armas leves, tem chance de realizar um segundo ataque com a mesma arma do ataque original.</p><p>Além disso, se realizar a ação "Tomar ar", sai da postura.</p>
    categoria: postura
    escalaPorNivel: 1% de chance adicional por nível
    formula: '[NVL]*(1+[NVL5=1;0]+[NVL10=1;0]+[NVL15=1;0]+[NVL20=1;0])'
    unidadeFormula: '% de chance'

- nome: Doutrina Militar
  id: 2pp5PXFMhtCryNwn
  pasta: Soldado
  system:
    descricao: '<p>Ao preparar uma operação, você pode combinar um procedimento de contingência com seus aliados: uma instrução associada a uma condição clara, funcionando como um Instinto temporário adicional para os aliados.</p><p>Exemplos:</p><ul><li><p>“Ao ouvir duas batidas, fechem a passagem.”</p></li><li><p>“Se o portador da tocha cair, quem estiver mais próximo assume a iluminação.”</p></li><li><p>“Quando a retirada for anunciada, reúnam-se na escadaria.”</p></li></ul><p></p><p>Dura até o final da operação.</p><p>Pode incluir a sí mesmo como alvo (não conta para o limite de alvos)</p><p>Ao atingir nível 5, 10, 15: Permite escolher diferentes instintos para diferentes alvos (ainda limitado a 1 por alvo).</p>'
    categoria: passiva
    ehBase: true
    escalaPorNivel: +1 aliado por nível.
    formula: '[NVL]'
    unidadeFormula: ' quantidade de aliados orientados.'

- nome: Organização de Bagagem
  id: D9fNrVW9Bq2nhVNr
  pasta: Soldado
  system:
    ehBase: true
    descricao: <p>Você sabe distribuir peso, ajustar correias e organizar seus pertences para carregar equipamento durante longas jornadas.</p><p>Após 10 minutos organizando sua bagagem, sua capacidade de carga aumenta, enquanto transportar os objetos devidamente acondicionados em mochilas, bolsas ou presos ao corpo.</p><p>Esse aumento não se aplica a carregar criaturas, erguer objetos ou transportar algo solto nas mãos.</p><p>Retirar ou guardar um objeto não desfaz a organização. Os 10 minutos só precisam ser repetidos quando você reorganizar substancialmente a carga.</p>
    categoria: passiva
    escalaPorNivel: +2 de peso por nível
    formula: 2*[NVL]
    unidadeFormula: ' de peso adicional'

- nome: Ronda Atenta
  id: zTxvVjlJUh5PzOdZ
  pasta: Soldado
  system:
    descricao: '<p>Você sabe preparar pequenos indicadores de passagem: alinhar objetos, posicionar fios discretos, aproveitar poeira, marcar uma porta ou utilizar materiais semelhantes.</p><p>Após <strong>1 minuto preparando um acesso</strong>, quem atravessá-lo deixa um sinal de passagem que você consegue reconhecer ao inspecioná-lo, sem precisar de um teste para interpretar seu próprio indicador.</p><p>Isso revela que alguém passou, não sua identidade, quantidade ou posição atual. Não dispara um aviso à distância.</p><p>Cada preparação pode cobrir uma passagem de até 1 metro de largura, aumentando em 1 por nível.</p>'
    escalaPorNivel: +1 metro de largura
    formula: '[NVL]'
    unidadeFormula: ' largura da passagem'

- nome: Criar Técnicas
  id: uxvUU5bND5BYkTwJ
  system:
    descricao: '<p>Você é capaz de criar técnicas* usando pontos de técnica, conforme o custo abaixo:</p><table><tbody><tr><td data-colwidth="88"><p>Ranque</p></td><td data-colwidth="25"><p>1</p></td><td data-colwidth="25"><p>2</p></td><td data-colwidth="25"><p>3</p></td><td data-colwidth="25"><p>4</p></td><td data-colwidth="48"><p>5</p></td><td data-colwidth="48"><p>6</p></td><td data-colwidth="52"><p>7</p></td></tr><tr><td data-colwidth="88"><p>Pontos</p></td><td data-colwidth="25"><p>1</p></td><td data-colwidth="25"><p>3</p></td><td data-colwidth="25"><p>6</p></td><td data-colwidth="25"><p>10</p></td><td data-colwidth="48"><p>15</p></td><td data-colwidth="48"><p>21</p></td><td data-colwidth="52"><p>28</p></td></tr></tbody></table><p>*: o ranque máximo de uma técnica aprendida pode ser no máximo igual ao seu DET+1.</p><p>Sempre que essa habilidade subir de nível, você pode recuperar pontos de técnica e redistribuir entre as técnicas, criar novas, ou até mesmo esquecer técnicas.</p><p>Essa habilidade sobe de nível baseado no nível das técnicas usadas (converta Rotineiras para níveis 1 à 5, Difíceis para 6 à 10, e técnicas nível 11+ são consideradas Muito Difíceis).</p><p>Ao atingir nível 5, 10, 15, 20: Aumente em 1 a quantidade de Pontos ganho por nível, retroativamente.</p>'
    categoria: passiva
    escalaPorNivel: +1 pontos de técnica por nível.
    formula: '[NVL]*(1+[NVL5=1;0]+[NVL10=1;0]+[NVL15=1;0]+[NVL20=1;0])'
    unidadeFormula: ' pontos de técnicas'

- nome: Feitiçaria - Conter Aura
  id: RJNlEgvBtvEICAph
  pasta: Feitiçaria
  system:
    descricao: <p>É o oposto da Aura de Proteção, o usuário desliga completamente e contém a energia dele dentro do corpo, tornando-o indetectável a outros usuários de energia espiritual. É uma técnica principalmente furtiva, um usuário experiente se torna invisível a detecção baseada em energia espiritual.</p><p>Quando ativo, a Aura de Proteção será desativada, e a Aura de Energia não poderá ser usada.</p><p>Também é usado passivamente para recuperar de exaustão de energia, pois suprimir a energia ajuda o corpo a recuperar ela mais rapidamente.</p>
    categoria: transformacao

- nome: Feitiçaria - Criar Feitiços
  id: 5JtyoSIwuTqHMBKM
  pasta: Feitiçaria
  system:
    descricao: <p>Feitiços são a expressão das habilidades pessoais únicas através da sua energia. A aplicação individual da energia é formada pela natureza, desejos e afinidade do usuário. É o que torna fortes feiticeiros diferentes uns dos outros.</p><p>Os feitiços são inseparáveis da afinidade de energia. Um fortificador amplifica seu físico, conjurador cria objetos, um transmutador transforma propriedades da energia, um emissor projeta energia, um manipulador controla coisas e um especialista é alguém com uma habilidade que não se enquadra nas categorias padrão. O poder de um feitiço escala diretamente com o quanto ele se alinha com a natureza real do usuário.</p>
    categoria: passiva
    escalaPorNivel: +1 ponto de criação por nível
    formula: '[NVL]*(2+[NVL5=1;0]+[NVL10=1;0]+[NVL15=1;0]+[NVL20=1;0])'
    unidadeFormula: ' pontos'

- nome: Feitiçaria Avançada - Esconder Aura
  id: ZnSf4RSXLfHEdaVn
  pasta: Feitiçaria
  system:
    descricao: <p>In renders the user's aura — or a conjured object's aura — completely invisible. While Suprimir Aura suppresses aura output entirely, In specifically hides aura from detection without removing its effects. The practical use is to conceal active Feitiço constructs (invisible threads, hidden weapons, silent attacks).</p><p>In is the opposite of Gyo. Gyo counters In by giving the user the perception to detect hidden aura. At high levels, the contest between In and Gyo users becomes the central dynamic of advanced Nen combat.</p>
    ranque: 2

- nome: Feitiçaria Avançada - Sentido Espiritual
  id: PoaUJ693Ud0WCzCa
  pasta: Feitiçaria
  system:
    descricao: <p>En extends the user's aura as an expanding sphere around their body, creating a field of spatial awareness. Anything that enters the En field is sensed — shape, size, speed, Nen presence. It's the most comprehensive detection technique available.</p><p>En range varies dramatically with the user's aura output. Average users manage a few meters; elite users extend dozens. The cost is continuous aura consumption proportional to the sphere's radius.</p>
    categoria: passiva
    ranque: 2
    escalaPorNivel: +10% de distância do sentido por nível.
    formula: '[PRE]/2*(0.9+0.1*[NVL])*[NVL5=2;1] *[NVL10=2;1]*[NVL15=2;1]*[NVL20=2;1]'
    unidadeFormula: ' metros'
    sentido:
      tipo: energia
      alcance: '[PRE]/2*(0.9+0.1*[NVL])*[NVL5=2;1] *[NVL10=2;1]*[NVL15=2;1]*[NVL20=2;1]'

- nome: Feitiçaria Avançada - Focar Aura
  id: wuDHT9xtzDhKgIuz
  pasta: Feitiçaria
  system:
    descricao: '<p>Ko forces all of the user''s aura into a single point — typically a fist or other striking surface — creating an attack of extreme destructive power.</p><p>The risk is absolute: every other part of the body is completely unprotected during Ko. A skilled opponent who reads the technique can exploit the exposed areas fatally. Ko is reserved for decisive moments where the goal is maximum damage over survival.</p>'
    ranque: 2

- nome: Conjuração Demoníaca
  id: akmqMaS6P89MjI19
  pasta: Feitiçaria
  system:
    ehBase: true
    descricao: <p>Transmutação 100%</p><p>Fortificação e Conjuração 80%</p><p>Emissão 60%</p><p>Manipulação 40%</p>
    categoria: passiva

