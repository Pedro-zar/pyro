- nome: Vida Austéra
  id: sLVIOTu8dZlw6QV0
  pasta: Monge
  system:
    ehBase: true
    descricao: '<p>Seu corpo está habituado a viver com pouco. A quantidade de alimento necessária para sua alimentação diária é reduzida.</p><p>Além disso, você consegue descansar normalmente em condições simples: chão firme, ausência de cama, roupas desconfortáveis e ruídos cotidianos não impedem seu descanso confortável.</p><p>Isso não permite descansar em meio a perigo imediato nem ignora frio extremo, calor extremo, doenças ou outras condições nocivas.</p>'
    categoria: passiva
    escalaPorNivel: 5% por nível da habilidade
    formula: '5'
    unidadeFormula: '% de alimentos necessários a menos'

- nome: Didática
  id: BWwGmMzwXaXXMkqR
  pasta: Professor
  system:
    ehBase: true
    descricao: <p>Você pode orientar o aprendizado de uma perícia que possua nível superior ao do aluno.</p><p>Quando um aluno realiza uma tarefa sob sua orientação, ele recebe um registro adicional de progresso da mesma dificuldade daquele teste. Isso não altera a rolagem, não garante sucesso e não dispensa condições específicas de progressão.</p><ul><li><p>Cada aluno pode receber esse benefício uma vez por objetivo, mesmo que faça vários testes.</p></li><li><p>Você precisa acompanhar a execução e se comunicar com ele, o orientando durante a cena.</p></li><li><p>Não pode usar a habilidade em si mesmo.</p></li></ul>
    escalaPorNivel: Pode orientar um aluno adicional por nível.
    custoAcoes: 2
    tipoCusto: reacao
    formula: '[NVL]'
    unidadeFormula: ' alunos orientados simultaneamente'

- nome: O Jeito Certo
  id: rmCflzND9q5MwQxE
  pasta: Professor
  system:
    descricao: <p>Quando algum aluno faz algo, ele erra, por isso os professores existem. Após um aluno falhar em uma ação próximo a você, você pode orientá-lo corretamente em como prosseguir, permitindo que ele tente novamente o teste desde que as condições o permitam.</p><p>Quando o aluno refizer o teste ele receberá um bônus.</p>
    escalaPorNivel: +1 bônus ao teste por nível.
    custoAcoes: 1
    tipoCusto: reacao
    formula: '[NVL]'
    unidadeFormula: ' bônus no teste'

- nome: Reflexão Prática
  id: aJc08AiBAlwBPcVr
  pasta: Professor
  system:
    ehBase: true
    descricao: '<p>Após enfrentar um objetivo no qual tenha usado uma perícia, você pode dedicar um tempo a revisar sua atuação: reconstruir o raciocínio, comparar métodos, identificar erros ou experimentar outra abordagem.</p><p>Escolha uma perícia que tenha utilizado e ganho um registro para aumentar seu nível há no máximo um dia. Ao concluir a revisão, receba um registro adicional da mesma categoria.</p><ul><li><p>Cada objetivo permite <strong>uma única revisão</strong>, de uma única perícia.</p></li></ul>'
    escalaPorNivel: Tempo de revisão reduzido em 2 minutos por nível
    formula: 60-[NVL]*2
    unidadeFormula: ' minutos de tempo de revisão.'

- nome: Passo das Sombras
  id: 8jpywSXratrKOTEu
  pasta: Sicário
  system:
    descricao: '<p>Uma vez no seu turno, imediatamente depois de um ataque corpo a corpo com uma arma leve, você pode se mover até 2 metros sem gastar ações e sem produzir som.</p><p>Esse movimento deve começar ou terminar em uma posição na qual você possa tentar se esconder do alvo (atrás de cobertura, fora de sua linha de visão ou em outra situação apropriada).</p><p>A habilidade não esconde você automaticamente: testes de Furtividade continuam necessários.</p>'
    ehBase: true
    escalaPorNivel: se mova 1 metro adicional por nível da habilidade
    formula: 1+[NVL]
    unidadeFormula: ' metros'

