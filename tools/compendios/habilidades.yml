- nome: Feitiçaria - Aura de Proteção
  id: zWaWmNNQV0Xd9iAA
  pasta: Feitiçaria
  system:
    descricao: <p>O usuário mantém uma camada fina de aura constantemente em seu corpo inteiro. Provendo uma proteção passiva contra danos físicos e energéticos.</p><p>Está sempre ativo.</p>
    categoria: transformacao
    escalaPorNivel: Aumenta a defesa recebida em 1
    formula: '[NVL]*[NVL5=2;1]*[NVL10=2;1]*[NVL15=2;1]*[NVL20=2;1]'
    unidadeFormula: ' de defesa física e energética'
  efeitos:
    - id: WO9sL5wU5H6s44Uv
      name: Aura de Proteção
      system:
        changes:
          - key: system.defesas.categorias.energetico
            value: '@nvl*2'
            priority: 20
          - key: system.defesas.categorias.fisico
