# Compêndio "Habilidades" do PYRO.
#
# Cada item é uma entrada da lista. `npm run build` gera o compêndio a partir
# daqui: edite, compile e o Foundry mostra a versão nova depois de recarregar.
#
#   nome:     obrigatório.
#   id:       16 letras ou números. Sem ele, o id sai do nome e da pasta, e
#             trocar um dos dois troca o id. Depois de criado, não mude.
#   pasta:    pastas do compêndio separadas por "/", como "Elfo/Formas".
#   img:      caminho da imagem. Sem ela, fica o ícone do tipo. "systems/pyro/"
#             vira o id do sistema no build.
#   system:   só os campos que fogem do padrão do tipo. O que faltar vem do
#             padrão ao carregar, então não precisa escrever campo vazio.
#   efeitos:  os efeitos ativos, no formato do Foundry (name, system.changes,
#             disabled, transfer...). id segue a mesma regra do item.
#   flags:    flags do item, se houver. As do sistema ficam sob "pyro", e o
#             build troca pelo id do sistema.
#
# Para copiar um item feito no mundo, exporte de novo com a macro e rode
# `npm run importar`: o que já está aqui não é tocado, só entra o que é novo.

- nome: Adquirir Informação
  id: lUWlanR2N2BCwavt
  pasta: Batedor
  system:
    descricao: <p>Ao identificar uma voz audível, você pode concentrar sua escuta nela. Enquanto mantiver essa atenção, consegue acompanhar suas palavras mesmo quando outras conversas, música ou ruídos comuns tornariam a fala indistinta. Ao fazer isso, você deixa de ouvir ou acompanhar outras informações de outras conversas ou sons.</p>
    escalaPorNivel: aumente o alcance em 2 metros.
    formula: 4+[NVL]*2
    unidadeFormula: ' metros de distância do som'

- nome: Memória Afiada
  id: FE3lOyK64St21Jh7
  pasta: Batedor
  system:
    ehBase: true
    descricao: '<p>Você pode dedicar atenção para memorizar uma informação que esteja percebendo: uma conversa breve, um rosto, um trecho de texto, a disposição de uma sala ou um percurso curto.</p><p>Depois disso, consegue recordar fielmente o que registrou, sem precisar de teste para se lembrar.</p>'
    categoria: passiva
    escalaPorNivel: Reduza o tempo necessário em 1 segundo por nível.
    formula: 21-[NVL]
    unidadeFormula: ' segundos necessários'

- nome: Sinal de Alerta
  id: ZgEqq3JpDfjJEAp0
  pasta: Batedor
  system:
    ehBase: true
    descricao: <p>Quando você percebe uma ameaça antes de ela atingir o grupo, pode emitir um aviso imediato. Você e um aliado em alcance curto que consiga perceber e compreender o aviso podem se deslocar até metade de sua movimentação, sem gastar ações, antes do início do confronto.</p>

- nome: Despertar da Lua
  id: K3uwM7Nwc4syNyzt
  pasta: Demi-Humanos
  system:
    descricao: '<p><span>Durante uma noite de lua cheia, quando seu <strong>gatilho emocional</strong> estiver presente, você pode gastar <strong>1 ação e 1 ponto de Força de Vontade</strong> para assumir sua forma lunar.</span></p><p><span>O gatilho deve expressar algo importante para o personagem: proteger alguém querido, perseguir um inimigo específico, não aceitar ser subjugado, entre outros.</span></p><h3><span>Transformação</span></h3><p><span>Enquanto transformado:</span></p><ul><li><p><span>Você possui <strong>8 ações no próprio turno</strong>.</span></p></li><li><p><span>Você possui <strong>3 reações por turno que não seja seu</strong>.</span></p></li><li><p><span>Sua distância de movimentação é dobrada.</span></p></li><li><p>Seus custos de estamina são cortados pela metade.</p></li><li><p><span>Sua <strong>Herança Animal assume uma manifestação extraordinária</strong>.</span></p></li></ul><p><span>A duração é de <strong>3 minutos por nível</strong>, dobrada cumulativamente nos níveis 5, 10, 15 e 20.</span></p><h2><span>Descontrole</span></h2><p><span>Enquanto transformado, seu gatilho emocional se torna um <strong>impulso dominante</strong>. Quando surgir uma decisão importante que contrarie esse impulso, você escolhe:</span></p><ul><li><p><span><strong>Seguir o impulso:</strong> permanece transformado, sem teste.</span></p></li><li><p><span><strong>Resistir:</strong> realiza um teste de Vontade (<strong>SAB</strong>).</span></p><ul><li><p><span><strong>Sucesso:</strong> recupera o controle e encerra a transformação.</span></p></li><li><p><span><strong>Falha:</strong> permanece transformado e entra em <strong>Frenesi</strong>.</span></p></li></ul></li></ul><h3><span>Frenesi</span></h3><p><span>Durante o Frenesi, você precisa agir diretamente para satisfazer o impulso, negligenciando objetivos incompatíveis com ele.</span></p><p><span>Isso <strong>não significa atacar aliados aleatoriamente</strong>. Eles podem se tornar obstáculos se tentarem impedir você, mas a ameaça deve nascer do impulso: atravessar uma posição segura para perseguir alguém, destruir o que bloqueia o caminho ou se recusar a abandonar um protegido.</span></p><p><span>Em combate, você pode repetir o teste <strong>no início do próprio turno</strong>. Fora dele, uma intervenção significativa ou mudança da situação permite uma nova tentativa. Um sucesso encerra a transformação.</span></p><h3><span>Encerrando a Transformação</span></h3><p>Ao sair da transformação de qualquer maneira, o peso acumulado da transformação recai sob o corpo, recebendo 5 de exaustão, nos níveis 5, 10, 15 e 20 esse valor é reduzido em 1.</p>'
    categoria: transformacao
    ehBase: true
    escalaPorNivel: +3 minutos de duração por nível
    custoAcoes: 1
    formula: '[NVL]*3*[NVL5=2;1]*[NVL10=2;1]*[NVL15=2;1]*[NVL20=2;1]'
    unidadeFormula: ' minutos de duração'
    duracao:
      valor: '@nvl *30'
    custoVontade: 1
  efeitos:
    - id: RJw1bVYnPG25tso4
      name: Despertar da Lua (exaustao)
      img: icons/svg/sleep.svg
      statuses:
        - exausto
      transfer: false
      flags:
        pyro:
          aoAcabar: true
          exaustao: 5
    - id: aUSNMvwusgaI0UJ3
      name: Despertar da Lua
      system:
        changes:
          - key: system.velocidadeMult
            value: 1
            priority: 20
          - key: system.acoesMax
            value: 2
            priority: 20
          - key: system.reacoesMax
            value: 1
            priority: 20
      flags:
        pyro:
          custos:
            - chave: estamina
              valor: 0.5
              modo: multiply
              ordem: 0
    - id: gfxDcKUJjFWR7FxD
      name: Despertar da Lua (alcance)
      flags:
        pyro:
          alcances:
            - formula: '2'
              modo: multiply
              prioridade: 1
          alvosItem:
            - nome: Caudas

- nome: Nove Caudas
  id: q9srHWToobSr11os
  pasta: Demi-Humanos/Raposa de Nove Caudas
  system:
    ehBase: true
    descricao: <p><span>Suas nove caudas são móveis e podem trabalhar em conjunto para segurar, envolver e manipular objetos.</span></p><p><span>Você pode utilizá-las para abrir uma porta destrancada, carregar uma lanterna, puxar uma alavanca, recolher algo atrás de si ou manter um objeto seguro enquanto suas mãos estão ocupadas.</span></p><ul><li><p><span>As caudas alcançam <strong>1 metro além do seu corpo</strong>.</span></p></li><li><p><span>Podem sustentar, entre todas elas, <strong>Carga igual ao nível da habilidade</strong>. Isso não aumenta sua capacidade total de carga.</span></p></li></ul><p><span><strong>Nos níveis 5, 10 e 15:</strong> o alcance aumenta em 1 metro.</span></p><p></p><h5>Manifestação lunar — Mar de Caudas</h5><p><span>Na transformação, <strong>cada uma das nove caudas se desdobra em outras nove</strong>, formando um manto de <strong>81 caudas</strong>, mais longas e capazes de agir coordenadamente.</span></p><h6><span>Manto Protetor</span></h6><p><span>O alcance das caudas é dobrado. Você pode envolvê-las ao redor de criaturas nesse alcance e <strong>usar sua reação de Bloquear para proteger uma delas</strong>, utilizando sua própria rolagem de Bloqueio.</span></p><ul><li><p><span>Você precisa perceber o ataque e conseguir colocar as caudas entre ele e a criatura.</span></p></li><li><p><span>A redução se aplica ao dano que aquela criatura receberia.</span></p></li><li><p><span>O bloqueio é aplicado antes da Esquiva ou Bloqueio da criatura protegida contra o mesmo ataque.</span></p></li><li><p><span>Cada uso protege uma criatura de uma instância de dano. Um ataque em área não é bloqueado para o grupo inteiro com uma única reação.</span></p></li></ul>
    categoria: passiva
  efeitos:
    - id: MuFsrwGj2T7ZfE6u
      name: Nove Caudas
      flags:
        pyro:
          alcances:
            - formula: '@nvl1+@nvl5+@nvl10+@nvl15'
              modo: add
              ordem: 0
          alvosItem:
            - nome: Caudas

- nome: Criar Técnicas Bestiais
  id: 6BY7ya4Xi9KpB9bu
  pasta: Demi-Humanos
  system:
    descricao: '<p>Você é capaz de criar técnicas* usando pontos de técnica, conforme o custo abaixo:</p><table><tbody><tr><td data-colwidth="88"><p>Ranque</p></td><td data-colwidth="25"><p>1</p></td><td data-colwidth="25"><p>2</p></td><td data-colwidth="25"><p>3</p></td><td data-colwidth="25"><p>4</p></td><td data-colwidth="48"><p>5</p></td><td data-colwidth="48"><p>6</p></td><td data-colwidth="52"><p>7</p></td></tr><tr><td data-colwidth="88"><p>Pontos</p></td><td data-colwidth="25"><p>1</p></td><td data-colwidth="25"><p>3</p></td><td data-colwidth="25"><p>6</p></td><td data-colwidth="25"><p>10</p></td><td data-colwidth="48"><p>15</p></td><td data-colwidth="48"><p>21</p></td><td data-colwidth="52"><p>28</p></td></tr></tbody></table><p>*: o ranque máximo de uma técnica aprendida pode ser no máximo igual ao seu DET+1.</p><p>Você só pode criar habilidades que utilizem seus ataques desarmados.</p><p>Sempre que essa habilidade subir de nível, você pode recuperar pontos de técnica e redistribuir entre as técnicas, criar novas, ou até mesmo esquecer técnicas.</p><p>Essa habilidade sobe de nível baseado no nível das técnicas usadas (converta Rotineiras para níveis 1 à 5, Difíceis para 6 à 10, e técnicas nível 11+ são consideradas Muito Difíceis).</p><p>Ao atingir nível 5, 10, 15, 20: Aumente em 1 a quantidade de Pontos ganho por nível, retroativamente.</p>'
    categoria: passiva
    ranque: 2
    escalaPorNivel: +1 pontos de técnica por nível.
    formula: '[NVL]*(1+[NVL5=1;0]+[NVL10=1;0]+[NVL15=1;0]+[NVL20=1;0])'
    unidadeFormula: ' pontos de técnicas'

