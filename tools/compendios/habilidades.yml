- nome: Furto Ardiloso
  id: MeeEI0AEzXi6f847
  pasta: Gatuno
  system:
    descricao: <p>Quando você realiza um furto bem-sucedido sem ser percebido, pode acomodar os pertences restantes, ajeitar a roupa ou substituir o volume retirado para disfarçar a ausência do furto.</p><p>Durante 1 minuto, a vítima não percebe a falta por sinais incidentais, como uma bolsa mais leve, um bolso menos volumoso ou a ausência do tilintar das moedas.</p><p>Procurar, conferir ou tentar usar o objeto revela a falta normalmente. A habilidade não esconde você durante o furto nem transforma falha em sucesso.</p>
    categoria: passiva
    ehBase: true
    escalaPorNivel: 1 minuto adicional antes de ser percebido, por nível.
    formula: '[NVL]*[NVL5=2;1] *[NVL10=2;1]*[NVL15=2;1]*[NVL20=2;1]'
    unidadeFormula: ' minutos antes de ser percebido'

- nome: Mestre das Fechaduras
  id: JTGEhUTuWMODzDD0
  pasta: Gatuno
  system:
    ehBase: true
    descricao: <p>Depois de arrombar uma fechadura ou mecanismo de fechamento sem destruí-lo, você pode deixar uma adaptação discreta, permitindo fechar a passagem e abri-la novamente sem repetir o teste.</p><p>A adaptação funciona apenas naquele mecanismo e pode ser utilizada por alguém que você tenha instruído. Ela deixa de funcionar se for encontrada e removida, se o mecanismo for reparado/substituído ou após 1 uso. Encontrá-la exige uma inspeção apropriada, não sendo evidente para quem apenas passa pelo local.</p><p>Isso não remove alarmes, armadilhas ou proteções mágicas independentes da fechadura.</p>
    categoria: passiva
    escalaPorNivel: +1 quantidade de uso antes de quebrar por nível
    formula: (1+[NVL])*[NVL5=2;1] *[NVL10=2;1]*[NVL15=2;1]*[NVL20=2;1]
    unidadeFormula: ' usos antes de quebrar a adaptação'

