            priority: 20

- nome: Feitiçaria - Aura de Energia
  id: 3H1n1Eliw1AOQvH6
  pasta: Feitiçaria
  system:
    descricao: '<p>Projeta a energia do usuário pra fora em grandes quantidades, intensificando dramaticamente as suas capacidades físicas: força, velocidade e durabilidade são aumentados. <br>A aura de energia é a fundação de combate feiticeiro ofensivo, a maioria das habilidades requerem a aura ativa para atingir poder total.</p><p>Para manter a aura ativa, há um consumo de energia espiritual, drenando as reservas de energia do usuário conforme o tempo.</p><p>Os valores dessa habilidade escalam com a afinidade de Fortificação.</p>'
    categoria: transformacao
    escalaPorNivel: +1 nos bônus fixos e 10% do dano em armas físicas
    custoEnergia: 1
    formula: 0.8*[NVL]
    unidadeFormula: ' de defesa física, energética, metros de velocidade e dano físico.'
    manutencao:
      custos:
        - recurso: energia
          valor: '1'
  efeitos:
