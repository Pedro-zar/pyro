      name: Aura de Energia
      system:
        changes:
          - key: system.velocidadeBonus
            value: '@nvl *0.8'
            priority: 20
          - key: system.defesas.categorias.fisico
            value: '@nvl *0.8'
            priority: 20
          - key: system.defesas.categorias.energetico
            value: '@nvl *0.8'
            priority: 20
